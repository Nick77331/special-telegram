<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blooket Utilities Hub</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            text-align: center;
            padding: 50px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: #2b2b2b;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.5);
        }
        h1 {
            color: #ffaa00;
        }
        .btn {
            display: block;
            width: 80%;
            margin: 15px auto;
            padding: 12px;
            background-color: #ff5722;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #e64a19;
        }
        p {
            color: #b0bec5;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Blooket Utility Hub</h1>
        <p>Drag these links to your bookmarks bar or copy the scripts to use in your browser console.</p>
        
        <!-- Example Bookmarklet Link -->
        <a class="btn" href="javascript:alert('Paste your Blooket script here!');">Sample Bookmarklet</a>
        
        <!-- Example External Script Link -->
        <a class="btn" href="https://github.com/Minesraft2/Blooket-Cheats" target="_blank">View External Scripts Repo</a>
    </div>

</body>
</html>
