<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Quiz Interface Example</title>
</head>
<body>
    <div id="quiz-container">
        <h2 id="question-text">Loading question...</h2>
        <div id="options-container"></div>
    </div>

    <script>
        // Example function fetching a question from a secure backend API
        async function fetchQuestion(gameId) {
            try {
                // The backend API returns the question text and options, but NOT the correct answer
                const response = await fetch(`https://example.com{gameId}/next-question`);
                const data = await response.json();
                
                displayQuestion(data);
            } catch (error) {
                console.error("Error fetching question:", error);
            }
        }

        function displayQuestion(gameData) {
            document.getElementById('question-text').textContent = gameData.question;
            const container = document.getElementById('options-container');
            container.innerHTML = ''; // Clear previous options

            gameData.options.forEach(option => {
                const button = document.createElement('button');
                button.textContent = option;
                button.onclick = () => submitAnswer(gameData.questionId, option);
                container.appendChild(button);
            });
        }

        async function submitAnswer(questionId, selectedOption) {
            // The selection is sent to the server for verification
            const response = await fetch(`https://example.com`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ questionId, answer: selectedOption })
            });
            const result = await response.json();
            
            alert(result.isCorrect ? "Correct!" : "Incorrect!");
        }
    </script>
</body>
</html>
